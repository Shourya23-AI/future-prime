services:
  postgres:
    image: postgres:15
    container_name: futureprime-postgres
    environment:
      POSTGRES_DB: futureprime_dev
      POSTGRES_USER: futureprime_user
      POSTGRES_PASSWORD: yourpassword
    ports:
      - "5432:5432"
    volumes:
      - futureprime_pgdata:/var/lib/postgresql/data

volumes:
  futureprime_pgdata: